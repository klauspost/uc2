name: Go

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-go@v6
        with:
          go-version-file: go.mod
      - name: gofmt
        run: test -z "$(gofmt -l . | tee /dev/stderr)"
      - name: go fix
        run: |
          for os in linux windows darwin; do
            out=$(GOOS=$os go fix -diff ./... 2>&1) || true
            if [ -n "$out" ]; then
              echo "$out"
              echo "::error::go fix has changes for GOOS=$os; run: GOOS=$os go fix ./..."
              exit 1
            fi
          done
      - name: go vet
        run: go vet ./...
      - name: staticcheck
        run: go run honnef.co/go/tools/cmd/staticcheck@latest ./...

  test:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-go@v6
        with:
          go-version-file: go.mod
      - name: Fetch sample archives
        run: go run testdata/fetch.go
        continue-on-error: true
      - name: Test
        run: go test ./...
      - name: Test with race detector
        if: matrix.os == 'ubuntu-latest'
        run: go test -race -short ./...
      - name: Test on 32-bit
        if: matrix.os == 'ubuntu-latest'
        run: GOARCH=386 go test -short ./...

  cross:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0
      - uses: actions/setup-go@v6
        with:
          go-version-file: go.mod
      - uses: goreleaser/goreleaser-action@v6
        with:
          version: "~> v2"
          args: build --snapshot --clean

  fuzz:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - pkg: .
            target: FuzzReader
          - pkg: ./internal/ultra
            target: FuzzDecode
          - pkg: ./internal/ultra
            target: FuzzRoundTrip
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-go@v6
        with:
          go-version-file: go.mod
      - name: Fetch sample archives
        run: go run testdata/fetch.go
        continue-on-error: true
      - name: Fuzz
        run: go test -run '^$' -fuzz '^${{ matrix.target }}$' -fuzztime 60s ${{ matrix.pkg }}
